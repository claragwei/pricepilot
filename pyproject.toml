[project]
name = "pricepilot"
version = "0.1.0"
description = "Explainable pricing decision-support platform (research-grade, simulation-based)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-postgres>=1.11.0",
    "dbt-snowflake>=1.12.4",
    "duckdb>=1.5.6",
    "lightgbm>=4.7.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pre-commit>=3.8",
    "types-psycopg2>=2.9.21.20261008",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["joblib.*", "lightgbm.*", "sklearn.*"]
ignore_missing_imports = true
